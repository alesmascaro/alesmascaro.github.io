name: Publish personal website
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: personal-website-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage website
        run: |
          mkdir -p "$RUNNER_TEMP/public-site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.Rproj.user/' ./ "$RUNNER_TEMP/public-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
